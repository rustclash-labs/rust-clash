name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.4.5)"
        required: true
        type: string
        default: "v0.4.5"
      target_platforms:
        description: "Platforms to build & publish (saves private-repo Actions minutes)"
        required: false
        type: choice
        default: "all"
        options:
          - "all"
          - "android"
          - "linux+android"
          - "desktop"
      run_android_tests:
        description: "Re-run Android JUnit/Robolectric + Lint during Release packaging"
        required: false
        type: boolean
        default: true
      allow_ephemeral_debug_signing:
        description: "Allow ephemeral debug APK signing when ANDROID_KEYSTORE_* secrets are absent (WARNING: breaks future Android in-place upgrades)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CI: "true"

jobs:
  prepare:
    name: Validate Tag, Versions, Signing Key & Build Web UI
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      version: ${{ steps.validate.outputs.version }}
      android_signing_mode: ${{ steps.validate.outputs.android_signing_mode }}
      build_android: ${{ steps.validate.outputs.build_android }}
      build_linux: ${{ steps.validate.outputs.build_linux }}
      build_windows: ${{ steps.validate.outputs.build_windows }}
      build_macos: ${{ steps.validate.outputs.build_macos }}
      expected_min_assets: ${{ steps.validate.outputs.expected_min_assets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Release Tag, Main Branch, Version Alignment, Identity Privacy & Android Keystore
        id: validate
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PLATFORMS: ${{ inputs.target_platforms }}
          REF_NAME: ${{ github.ref_name }}
          ALLOW_EPHEMERAL: ${{ inputs.allow_ephemeral_debug_signing }}
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$WORKFLOW_REF" != "refs/heads/main" ]]; then
              echo "::error::ERROR: workflow_dispatch releases are only permitted from refs/heads/main (got '$WORKFLOW_REF')." >&2
              exit 1
            fi
            TAG="${INPUT_TAG}"
            PLATFORMS="${INPUT_PLATFORMS:-all}"
          else
            TAG="${REF_NAME}"
            PLATFORMS="all"
          fi
          TAG="$(echo -n "$TAG" | xargs)"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag '$TAG'. Expected format like 'v0.4.0'." >&2
            exit 1
          fi

          VERSION="${TAG#v}"
          BASE_VERSION="${VERSION%%-*}"

          python3 - "$BASE_VERSION" "$TAG" <<'PY'
          import json, pathlib, plistlib, re, subprocess, sys, tomllib

          expected = sys.argv[1]
          release_tag = sys.argv[2]

          allowed_emails = {"rustclash.labs@proton.me", "noreply@github.com"}
          allowed_names = {"rustclash labs", "github"}

          tags_out = subprocess.check_output(
              ["git", "tag", "--list", "v*.*.*", "--sort=-v:refname"], text=True
          ).splitlines()
          prev_tag = next((t.strip() for t in tags_out if t.strip() and t.strip() != release_tag), "")

          rev_spec = "HEAD"
          if prev_tag:
              anc = subprocess.run(
                  ["git", "merge-base", "--is-ancestor", prev_tag, "HEAD"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              if anc.returncode == 0:
                  rev_spec = f"{prev_tag}..HEAD"

          cmd = (
              ["git", "log", "--format=%H%x1f%an%x1f%ae%x1f%cn%x1f%ce", rev_spec]
              if ".." in rev_spec
              else ["git", "log", "-1", "--format=%H%x1f%an%x1f%ae%x1f%cn%x1f%ce", "HEAD"]
          )
          raw = subprocess.check_output(cmd, text=True).strip()
          if not raw:
              raw = subprocess.check_output(
                  ["git", "log", "-1", "--format=%H%x1f%an%x1f%ae%x1f%cn%x1f%ce", "HEAD"],
                  text=True,
              ).strip()

          for line in [ln for ln in raw.splitlines() if ln.strip()]:
              sha, an, ae, cn, ce = line.split("\x1f")
              for role, name, email in [("author", an, ae), ("committer", cn, ce)]:
                  norm_email = email.strip().lower()
                  norm_name = name.strip().lower()
                  email_ok = norm_email in allowed_emails or norm_email.endswith("[bot]@users.noreply.github.com")
                  name_ok = norm_name in allowed_names or norm_name.endswith("[bot]")
                  if not email_ok or not name_ok:
                      raise SystemExit(
                          f"Privacy gate failed: commit {sha[:12]} {role} '{name} <{email}>' exposes a personal identity. "
                          "Run ./scripts/setup_git_identity.sh ('RustClash Labs <rustclash.labs@proton.me>') before committing."
                      )

          cargo_ver = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
          tauri_ver = json.loads(pathlib.Path("crates/tauri-app/tauri.conf.json").read_text())["version"]
          ui_ver = json.loads(pathlib.Path("ui/package.json").read_text())["version"]
          plist_ver = plistlib.loads(pathlib.Path("platforms/macos-ne/Info.plist").read_bytes()).get("CFBundleShortVersionString", "")
          gradle_txt = pathlib.Path("android/app/build.gradle.kts").read_text()
          m_name = re.search(r'versionName\s*=\s*"([^"]+)"', gradle_txt)
          m_code = re.search(r'versionCode\s*=\s*(\d+)', gradle_txt)
          android_ver = m_name.group(1) if m_name else ""
          android_code = int(m_code.group(1)) if m_code else 0
          readme_txt = pathlib.Path("README.md").read_text()

          mismatches = []
          for label, actual in [
              ("Cargo.toml", cargo_ver),
              ("crates/tauri-app/tauri.conf.json", tauri_ver),
              ("ui/package.json", ui_ver),
              ("android/app/build.gradle.kts (versionName)", android_ver),
              ("platforms/macos-ne/Info.plist (CFBundleShortVersionString)", plist_ver),
          ]:
              if actual != expected:
                  mismatches.append(f"{label}={actual} (expected {expected})")

          if f"`v{expected}` Latest Release" not in readme_txt:
              mismatches.append(f"README.md missing '`v{expected}` Latest Release' link")

          if mismatches:
              raise SystemExit("Version mismatch against release tag: " + ", ".join(mismatches))
          if android_code < 3:
              raise SystemExit(f"Android versionCode ({android_code}) must be >= 3 for upgrade compatibility")

          print(f"Verified version alignment & anonymous project identity: {expected} (Android versionCode={android_code})")
          PY

          case "$PLATFORMS" in
            android)
              BUILD_ANDROID="true"
              BUILD_LINUX="false"
              BUILD_WINDOWS="false"
              BUILD_MACOS="false"
              EXPECTED_ASSETS="4"
              ;;
            linux+android)
              BUILD_ANDROID="true"
              BUILD_LINUX="true"
              BUILD_WINDOWS="false"
              BUILD_MACOS="false"
              EXPECTED_ASSETS="7"
              ;;
            desktop)
              BUILD_ANDROID="false"
              BUILD_LINUX="true"
              BUILD_WINDOWS="true"
              BUILD_MACOS="true"
              EXPECTED_ASSETS="10"
              ;;
            all|*)
              BUILD_ANDROID="true"
              BUILD_LINUX="true"
              BUILD_WINDOWS="true"
              BUILD_MACOS="true"
              EXPECTED_ASSETS="14"
              ;;
          esac

          SIGNING_MODE="skipped"
          if [[ "$BUILD_ANDROID" == "true" ]]; then
            if [[ -n "$KS_B64" && -n "$KS_PASS" && -n "$KS_ALIAS" ]]; then
              TMP_KS="$(mktemp "${RUNNER_TEMP:-/tmp}/verify-ks-XXXXXX.keystore")"
              trap 'rm -f "$TMP_KS"' EXIT
              chmod 600 "$TMP_KS"
              python3 - "$TMP_KS" <<'PY'
          import base64, os, pathlib, sys
          raw = "".join(os.environ["KS_B64"].split())
          pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(raw))
          PY
              CERT_FP="$(keytool -list -v -keystore "$TMP_KS" -storepass:env KS_PASS -alias "$KS_ALIAS" | grep -i 'SHA256:' | head -n 1 | sed 's/^[[:space:]]*//')"
              if [[ -z "$CERT_FP" ]]; then
                echo "::error::Failed reading signing certificate for alias '$KS_ALIAS' from ANDROID_KEYSTORE_BASE64." >&2
                exit 1
              fi
              rm -f "$TMP_KS"
              SIGNING_MODE="release"
              {
                printf '### Release Preflight (`%s`, platforms: `%s`)\n' "$TAG" "$PLATFORMS"
                printf '%s\n' '- **Android Signing**: Persistent Release Keystore (`envRelease`, v1+v2+v3)'
                printf -- '- **Certificate Fingerprint**: `%s`\n' "$CERT_FP"
              } >> "$GITHUB_STEP_SUMMARY"
            elif [[ "$ALLOW_EPHEMERAL" == "true" ]]; then
              echo "::warning::ANDROID_KEYSTORE_* secrets are not configured; proceeding with ephemeral debug signing because allow_ephemeral_debug_signing=true."
              SIGNING_MODE="debug"
              {
                printf '### Release Preflight (`%s`, platforms: `%s`)\n' "$TAG" "$PLATFORMS"
                printf '%s\n' '- **Android Signing**: WARNING — Ephemeral Debug Keystore (`allow_ephemeral_debug_signing=true`)'
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Missing persistent Android signing secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS)!" >&2
              exit 1
            fi
          fi

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "android_signing_mode=$SIGNING_MODE"
            echo "build_android=$BUILD_ANDROID"
            echo "build_linux=$BUILD_LINUX"
            echo "build_windows=$BUILD_WINDOWS"
            echo "build_macos=$BUILD_MACOS"
            echo "expected_min_assets=$EXPECTED_ASSETS"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Test & Build Production Embedded Web Console Once
        working-directory: ui
        run: |
          npm ci
          npm test
          npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-ui-dist
          path: ui/dist
          retention-days: 1
          if-no-files-found: error

  quality-gate:
    name: Workspace Quality Gate (Fmt, Clippy & Full Unit/Integration Tests)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-ui-dist
          path: ui/dist

      - name: Install Tauri 2 System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "linux-workspace"

      - name: Workspace + Tauri Desktop Format, Clippy & Unit/Integration Suite
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --features tauri-app/desktop -- -D warnings
          cargo test --locked --workspace --features tauri-app/desktop

  build-linux:
    name: Desktop & CLI Release (linux-x86_64)
    needs: prepare
    if: needs.prepare.outputs.build_linux == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-ui-dist
          path: ui/dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "release-linux-x86_64"
      - name: Install Linux Tauri & Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm
      - name: Build Tauri Linux Packages (deb + rpm) & Standalone CLI (Shared Release Graph)
        run: |
          set -euo pipefail
          mkdir -p release-out
          (cd crates/tauri-app && npx --yes --package=@tauri-apps/cli@2.12.4 tauri build --target x86_64-unknown-linux-gnu --bundles deb,rpm --features desktop)
          cargo build --locked --release -p proxy-cli -p tauri-app --features tauri-app/desktop --target x86_64-unknown-linux-gnu --bin rust-clash
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md target/x86_64-unknown-linux-gnu/release/
          tar -C target/x86_64-unknown-linux-gnu/release -czf release-out/rust-clash-cli-linux-x86_64.tar.gz \
            rust-clash LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md
          cp target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb release-out/
          cp target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm release-out/
          ls -lh release-out/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-pkg-linux-x86_64
          path: release-out/*
          retention-days: 1
          if-no-files-found: error

  build-windows:
    name: Desktop & CLI Release (windows-x86_64)
    needs: prepare
    if: needs.prepare.outputs.build_windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-ui-dist
          path: ui/dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "release-windows-x86_64"
      - name: Install NASM on Windows (required by aws-lc-sys)
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm --no-progress -y
          }
          if (Test-Path "C:\Program Files\NASM") {
            "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Fetch & SHA-256 Verify Official Signed Wintun Driver
        shell: pwsh
        run: |
          python scripts/fetch_wintun.py --self-test
          python scripts/fetch_wintun.py --arch amd64 --out-dir target/x86_64-pc-windows-msvc/release
          python scripts/fetch_wintun.py --arch amd64 --out-dir crates/tauri-app/wintun-bundle
      - name: Build Tauri Windows Installers (NSIS + MSI) & Standalone CLI (Shared Release Graph)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-out | Out-Null
          Push-Location crates/tauri-app
          $extraCfg = '{"bundle":{"resources":{"../../LICENSE-MIT":"LICENSE-MIT","../../LICENSE-APACHE":"LICENSE-APACHE","../../THIRD_PARTY_NOTICES.md":"THIRD_PARTY_NOTICES.md","wintun-bundle/wintun.dll":"wintun.dll","wintun-bundle/wintun-LICENSE.txt":"wintun-LICENSE.txt"}}}'
          npx --yes --package=@tauri-apps/cli@2.12.4 tauri build --target x86_64-pc-windows-msvc --bundles nsis,msi --features desktop --config $extraCfg
          Pop-Location
          cargo build --locked --release -p proxy-cli -p tauri-app --features tauri-app/desktop --target x86_64-pc-windows-msvc --bin rust-clash
          Compress-Archive -Path `
            target/x86_64-pc-windows-msvc/release/rust-clash.exe, `
            target/x86_64-pc-windows-msvc/release/wintun.dll, `
            target/x86_64-pc-windows-msvc/release/wintun-LICENSE.txt, `
            LICENSE-MIT, `
            LICENSE-APACHE, `
            THIRD_PARTY_NOTICES.md `
            -DestinationPath release-out/rust-clash-cli-windows-x86_64.zip
          Copy-Item target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe -Destination release-out/
          Copy-Item target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi -Destination release-out/
          Get-ChildItem release-out/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-pkg-windows-x86_64
          path: release-out/*
          retention-days: 1
          if-no-files-found: error

  build-macos:
    name: Desktop & CLI Release (macOS ${{ matrix.arch }})
    needs: prepare
    if: needs.prepare.outputs.build_macos == 'true'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            cli_archive: rust-clash-cli-macos-arm64.tar.gz
          - arch: x86_64
            target: x86_64-apple-darwin
            cli_archive: rust-clash-cli-macos-x86_64.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-ui-dist
          path: ui/dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "release-macos-${{ matrix.arch }}"
      - name: Build macOS (${{ matrix.arch }}) DMG Installer & Standalone CLI (Shared Release Graph)
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
          CLI_ARCHIVE: ${{ matrix.cli_archive }}
        run: |
          set -euo pipefail
          mkdir -p release-out
          (cd crates/tauri-app && npx --yes --package=@tauri-apps/cli@2.12.4 tauri build --target "$TARGET_TRIPLE" --bundles dmg --features desktop)
          cargo build --locked --release -p proxy-cli -p tauri-app --features tauri-app/desktop --target "$TARGET_TRIPLE" --bin rust-clash
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md "target/${TARGET_TRIPLE}/release/"
          tar -C "target/${TARGET_TRIPLE}/release" -czf "release-out/${CLI_ARCHIVE}" \
            rust-clash LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md
          cp "target/${TARGET_TRIPLE}/release/bundle/dmg/"*.dmg release-out/
          ls -lh release-out/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-pkg-macos-${{ matrix.arch }}
          path: release-out/*
          retention-days: 1
          if-no-files-found: error

  build-android:
    name: Android Release (Signed Split APKs + Universal APK + Play Store AAB)
    needs: prepare
    if: needs.prepare.outputs.build_android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-ui-dist
          path: ui/dist

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "android-ndk"

      - name: Cache Gradle Wrapper, Build Cache & Robolectric Runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository/org/robolectric
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Configure JDK 17 & Android SDK/NDK 27.2.12479018
        run: |
          set -euo pipefail
          if [[ -n "${JAVA_HOME_17_X64:-}" ]] && [[ -d "${JAVA_HOME_17_X64}" ]]; then
            echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"
            echo "${JAVA_HOME_17_X64}/bin" >> "$GITHUB_PATH"
          fi
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          if [[ ! -d "${SDK_ROOT}/platforms/android-35" || ! -d "${SDK_ROOT}/build-tools/35.0.0" || ! -d "${SDK_ROOT}/ndk/27.2.12479018" ]]; then
            SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
            if [[ ! -x "$SDKMANAGER" ]]; then
              SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f | head -n 1)"
            fi
            (yes || true) | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          fi
          echo "ANDROID_NDK_HOME=${SDK_ROOT}/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build & Verify Signed Android Split APKs, Universal APK & AAB Packages
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SIGNING_MODE: ${{ needs.prepare.outputs.android_signing_mode }}
          RUN_ANDROID_TESTS: ${{ inputs.run_android_tests }}
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p release-out
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "${RUN_ANDROID_TESTS}" == "false" ]]; then
            export ANDROID_SKIP_CHECKS="1"
          else
            export ANDROID_SKIP_CHECKS="0"
          fi

          if [[ "$SIGNING_MODE" == "release" ]]; then
            KS_FILE="$(mktemp "${RUNNER_TEMP:-/tmp}/android-release-XXXXXX.keystore")"
            trap 'rm -f "$KS_FILE"' EXIT
            chmod 600 "$KS_FILE"
            python3 - "$KS_FILE" <<'PY'
          import base64, os, pathlib, sys
          raw = "".join(os.environ["KS_B64"].split())
          pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(raw))
          PY
            ANDROID_BUILD_VARIANT=release \
              ANDROID_KEYSTORE_PATH="$KS_FILE" \
              ./scripts/build_android.sh
            cp android/app/build/outputs/apk/release/app-arm64-v8a-release.apk release-out/rust-clash-android-arm64-v8a.apk
            cp android/app/build/outputs/apk/release/app-x86_64-release.apk release-out/rust-clash-android-x86_64.apk
            cp android/app/build/outputs/apk/release/app-universal-release.apk release-out/rust-clash-android-universal.apk
            cp android/app/build/outputs/bundle/release/app-release.aab release-out/rust-clash-android-bundle.aab
            rm -f "$KS_FILE"
          else
            ANDROID_BUILD_VARIANT=debug ./scripts/build_android.sh
            cp android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk release-out/rust-clash-android-arm64-v8a.apk
            cp android/app/build/outputs/apk/debug/app-x86_64-debug.apk release-out/rust-clash-android-x86_64.apk
            cp android/app/build/outputs/apk/debug/app-universal-debug.apk release-out/rust-clash-android-universal.apk
            cp android/app/build/outputs/bundle/debug/app-debug.aab release-out/rust-clash-android-bundle.aab
          fi

          APKSIGNER_BIN="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          for apk_pkg in \
            release-out/rust-clash-android-arm64-v8a.apk \
            release-out/rust-clash-android-x86_64.apk \
            release-out/rust-clash-android-universal.apk
          do
            "$APKSIGNER_BIN" verify --min-sdk-version 26 --print-certs "$apk_pkg" >/dev/null
          done
          CERT_INFO="$("$APKSIGNER_BIN" verify --min-sdk-version 26 --print-certs release-out/rust-clash-android-arm64-v8a.apk)"
          echo "$CERT_INFO"
          {
            echo "### Android APK Signature Verification"
            echo '```'
            echo "$CERT_INFO"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          ls -lh release-out/

      - name: Prune Transient Gradle Locks Before Cache Save
        if: always()
        run: rm -rf ~/.gradle/caches/modules-2/modules-2.lock ~/.gradle/caches/*/plugin-resolution/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-pkg-android
          path: release-out/*
          retention-days: 1
          if-no-files-found: error

  publish-release:
    name: Publish Atomic GitHub Release (${{ needs.prepare.outputs.tag }})
    needs: [prepare, quality-gate, build-linux, build-windows, build-macos, build-android]
    permissions:
      contents: write
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      needs.quality-gate.result == 'success' &&
      (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped') &&
      (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') &&
      (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped') &&
      (needs.build-android.result == 'success' || needs.build-android.result == 'skipped') &&
      (needs.build-linux.result == 'success' || needs.build-windows.result == 'success' || needs.build-macos.result == 'success' || needs.build-android.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-pkg-*
          path: release-dist
          merge-multiple: true

      - name: Generate SHA256SUMS, Release Notes & Verify Deliverable Completeness
        env:
          MIN_ASSETS: ${{ needs.prepare.outputs.expected_min_assets }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          COUNT="$(ls -1 release-dist | wc -l | xargs)"
          echo "Collected $COUNT platform packages (expected >= ${MIN_ASSETS}):"
          ls -lh release-dist
          if [[ "$COUNT" -lt "${MIN_ASSETS}" ]]; then
            echo "::error::Expected at least ${MIN_ASSETS} release packages, found $COUNT" >&2
            exit 1
          fi
          (cd release-dist && sha256sum * | sort -k2 > SHA256SUMS.txt)

          PREV_TAG="$(git tag --list 'v*.*.*' --sort=-v:refname | grep -Fxv "${RELEASE_TAG}" | head -n 1 || true)"
          {
            echo "## What's Changed"
            echo ""
            if [[ -n "${PREV_TAG}" ]] && git rev-parse --verify "${PREV_TAG}" >/dev/null 2>&1; then
              git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:'- %s (`%h`)'
              echo ""
              echo ""
              echo "**Full Changelog**: https://github.com/${REPO_SLUG}/compare/${PREV_TAG}...${RELEASE_TAG}"
            else
              git log -n 10 --no-merges --pretty=format:'- %s (`%h`)'
              echo ""
            fi
            echo ""
            echo "<details><summary>SHA-256 Checksums</summary>"
            echo ""
            echo '```text'
            cat release-dist/SHA256SUMS.txt
            echo '```'
            echo "</details>"
          } > release-notes.md

          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "RustClash ${{ needs.prepare.outputs.tag }}"
          body_path: release-notes.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: release-dist/*
