[package]
name = "tauri-app"
description = "Tauri 2 cross-platform desktop client for rust-clash"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "rust_clash_tauri_lib"
crate-type = ["rlib"]

[[bin]]
name = "rust-clash-desktop"
path = "src/main.rs"

[features]
default = []
# Enable native Tauri 2 WebView window & system tray (requires WebKit2GTK on Linux; automatic on Windows/macOS CI)
desktop = ["dep:tauri", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", optional = true }

[target.'cfg(windows)'.build-dependencies]
tauri-winres.workspace = true

[dependencies]
proxy-core = { path = "../proxy-core" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
rand.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tauri = { version = "2", optional = true, features = ["tray-icon"] }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
