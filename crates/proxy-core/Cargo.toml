[package]
name = "proxy-core"
description = "Pure-Rust multi-protocol proxy kernel supporting Shadowsocks (AEAD/2022), VLESS+Encryption (mlkem768x25519plus), AnyTLS v2, Fake-IP DNS, smoltcp TUN, and Mihomo-compatible Rule Engine & Control API"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["embedded-ui"]
embedded-ui = ["dep:rust-embed"]

