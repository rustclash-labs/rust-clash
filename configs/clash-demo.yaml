# ==============================================================================
# SYNTHETIC EXAMPLE CONFIGURATION ONLY — CONTAINS ZERO REAL SERVERS OR SECRETS
# ==============================================================================
# All hostnames (`*.example.com`, RFC 2606), UUIDs (`00000000-0000-4000-...`),
# base64 keys (`0x42` repeated), VLESS `encryption` test vectors (generated via
# `rust-clash keygen-vless` with the private decryption key discarded), and
# passwords below are non-functional placeholders for schema validation (`check`).
#
# NEVER commit real subscription URLs, server IPs, or credentials to Git.
# Copy this file to `configs/my.local.yaml` (gitignored) for local testing.
# ==============================================================================

mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: info
external-controller: 127.0.0.1:9090

dns:
  enable: true
  listen: 127.0.0.1:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/15
  fake-ip-filter:
    - localhost
    - "*.lan"
    - "+.msftconnecttest.com"
  default-nameserver:
    - 1.1.1.1:53
    - 223.5.5.5:53
  nameserver:
    - https://cloudflare-dns.com/dns-query
    - https://dns.alidns.com/dns-query

tun:
  enable: false
  stack: smoltcp
  device: utun-clash0
  auto-route: false
  mtu: 1500

