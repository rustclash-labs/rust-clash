  - name: LAX-AnyTLS-v2
    type: anytls
    server: lax.example.com
    port: 443
    password: replace-with-anytls-password
    sni: lax.example.com
    idle-session-check-interval: 30
    idle-session-timeout: 60
    min-idle-session: 1

proxy-groups:
  - name: 🚀 Proxy
    type: select
    proxies:
      - ⚡ Auto-Best
      - TYO-VLESS-PQ-0RTT
      - HK-SS2022-AES256
      - LAX-AnyTLS-v2
      - DIRECT

  - name: ⚡ Auto-Best
    type: url-test
    proxies:
      - TYO-VLESS-PQ-0RTT
      - HK-SS2022-AES256
      - LAX-AnyTLS-v2
    url: http://www.gstatic.com/generate_204
    interval: 120
    tolerance: 30

rules:
  - DOMAIN-SUFFIX,anthropic.com,🚀 Proxy
  - DOMAIN-SUFFIX,github.com,🚀 Proxy
  - DOMAIN-KEYWORD,google,⚡ Auto-Best
  - GEOSITE,cn,DIRECT
  - GEOIP,PRIVATE,DIRECT,no-resolve
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,🚀 Proxy
