[workspace]
resolver = "2"
members = [
    "crates/proxy-core",
    "crates/proxy-cli",
    "crates/proxy-ffi",
    "crates/tauri-app",
]
default-members = [
    "crates/proxy-core",
    "crates/proxy-cli",
    "crates/proxy-ffi",
    "crates/tauri-app",
]

[workspace.package]
version = "0.4.6"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["RustClash Labs <rustclash.labs@proton.me>"]
repository = "https://github.com/rustclash-labs/rust-clash"
homepage = "https://github.com/rustclash-labs/rust-clash"

[workspace.dependencies]
jni = "0.21"
libc = "0.2"
tokio = { version = "1.44", features = ["full"] }
aws-lc-rs = "1.13"
ml-kem = { version = "0.2", features = ["deterministic"] }
x25519-dalek = { version = "2.0", features = ["static_secrets", "zeroize"] }
blake3 = "1.8"
md-5 = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }
rustls-pki-types = "1.11"
webpki-roots = "1.0"
rcgen = "0.13"
smoltcp = { version = "0.12", default-features = false, features = [
    "std",
    "log",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
    "socket-udp",
] }
axum = { version = "0.8", features = ["ws", "macros"] }
http = "1"
tokio-tungstenite = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_path_to_error = "0.1"
serde-saphyr = { version = "2.1", default-features = false, features = ["serialize", "deserialize"] }
clap = { version = "4.5", features = ["derive", "env"] }
anstyle = "1.0"
uuid = { version = "1.15", features = ["v4", "serde"] }
base64 = "0.22"
hex = "0.4"
rand = "0.9"
ipnet = { version = "2.11", features = ["serde"] }
regex = "1.11"
lru = "0.16"
dashmap = "6.1"
parking_lot = "0.12"
bytes = "1.10"
futures-util = "0.3"
async-trait = "0.1"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2.5"
rust-embed = { version = "8.7", features = ["interpolate-folder-path"] }
socket2 = { version = "0.5", features = ["all"] }
flate2 = "1.1"
proptest = "1.6"
tauri-winres = "0.3"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Networking_WinInet",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
strip = "symbols"
panic = "abort"
